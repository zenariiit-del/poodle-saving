<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7dce8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="プー＄貯金">
  <title>プー＄貯金</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card glass">
      <img id="loginPoodle" src="./icons/poodle.svg" class="login-poodle" alt="">
      <div class="login-title">プー＄貯金</div>
      <div class="login-copy">この端末では最初の1回だけパスワードを入力します。</div>
      <form id="loginForm">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="パスワード" required>
        <button type="submit" class="login-button">開く</button>
      </form>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <main id="app" class="wrap hidden">
    <section class="glass hero">
      <img id="headerPoodle" src="./icons/poodle.svg" class="poodle" alt="">
      <div class="title">プー＄貯金</div>
      <div class="bubble"></div>
    </section>

    <section class="stats">
      <div class="glass stat">
        <div class="stat-head">
          <div class="label">今日の合計</div>
          <div class="mini-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 18V9M12 18V5M18 18v-7"/>
            </svg>
          </div>
        </div>
        <div id="todayTotal" class="amount">$0</div>
        <div id="todayYen" class="yen">(約 ¥0)</div>
      </div>

      <div class="glass stat">
        <div class="stat-head">
          <div class="label">今月の合計</div>
          <div class="mini-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16l5-5 4 4 7-8M16 8h4v4"/>
            </svg>
          </div>
        </div>
        <div id="monthTotal" class="amount">$0</div>
        <div id="monthYen" class="yen">(約 ¥0)</div>
      </div>
    </section>

    <section class="glass rate-card">
      <div class="rate-title">今日の屁ぶ価</div>
      <div id="rateMain" class="rate-main">$1 = ¥—</div>
      <div id="rateDate" class="rate-date">取得中...</div>
    </section>

    <section class="actions">
      <button id="undoButton" class="action-button back-button" type="button">↩ 戻す</button>
      <button id="addButton" class="action-button add-button" type="button">💨 おならした +$10</button>
    </section>

    <section class="glass calendar-card">
      <div class="calendar-nav">
        <button id="prevMonth" class="nav-button" type="button">‹</button>
        <div>
          <div id="monthTitle" class="month-title"></div>
          <div id="monthSub" class="month-sub">📍 今月を表示中</div>
        </div>
        <button id="nextMonth" class="nav-button" type="button">›</button>
      </div>
      <div class="weekdays">
        <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="glass chart-card">
      <div class="chart-head">
        <div id="chartTitle" class="chart-title"></div>
        <div class="chart-unit">単位：$</div>
      </div>
      <div class="chart-scroll">
        <div id="yearChart" class="year-chart"></div>
      </div>
    </section>

    <section class="glass icon-settings">
      <div class="icon-settings-title">キャラクター画像</div>
      <div class="icon-settings-row">
        <img id="settingsPoodle" src="./icons/poodle.svg" class="settings-poodle" alt="">
        <div class="icon-settings-buttons">
          <label class="image-select-button" for="iconFileInput">画像を選ぶ</label>
          <input id="iconFileInput" type="file" accept="image/*" hidden>
          <button id="resetIconButton" class="reset-icon-button" type="button">元に戻す</button>
        </div>
      </div>
      <div class="icon-settings-note">選んだ画像はこの端末に保存されます。</div>

      <div class="home-icon-section">
        <div class="home-icon-title">ホーム画面アイコン</div>
        <div class="home-icon-note">上で選んだ画像から、iPhone用アイコンを作成できます。</div>
        <button id="generateHomeIconsButton" class="generate-icon-button" type="button">ホーム画面用アイコンを作る</button>
        <div id="iconDownloadArea" class="icon-download-area hidden">
          <a id="download180" download="apple-touch-icon.png">180px</a>
          <a id="download192" download="icon-192.png">192px</a>
          <a id="download512" download="icon-512.png">512px</a>
        </div>
      </div>
    </section>

    <div class="footer-actions">
      <button id="logoutButton" class="logout-button" type="button">この端末の認証を解除</button>
    </div>
  </main>


  <div id="editModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card glass" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div id="editTitle" class="modal-title">過去データを編集</div>
      <div id="editDate" class="modal-date"></div>

      <div class="modal-current">
        現在の合計
        <span id="editCurrentTotal">$0</span>
      </div>

      <div class="quick-adjust">
        <button id="minus10Button" type="button">− $10</button>
        <button id="plus10Button" type="button">＋ $10</button>
      </div>

      <label class="amount-input-label" for="editAmount">この日の合計</label>
      <div class="amount-input-wrap">
        <span>$</span>
        <input id="editAmount" type="number" inputmode="numeric" step="1" min="0" value="0">
      </div>

      <div class="modal-actions">
        <button id="cancelEditButton" class="modal-cancel" type="button">キャンセル</button>
        <button id="saveEditButton" class="modal-save" type="button">保存</button>
      </div>

      <div class="modal-note">日付をタップすると、いつでもその日の合計を修正できます。</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
